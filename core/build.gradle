plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.vanniktech.maven.publish)
    alias(libs.plugins.signing)
}

android {
    namespace 'com.qmdeve.blurview'
    compileSdk 37
    ndkVersion = "30.0.15729638"

    defaultConfig {
        minSdk 23

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "4.1.2"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation libs.annotation.jvm
    implementation libs.core
    implementation libs.tracing
}

if (hasProperty('jitpack')) {
    return
}
mavenPublishing {
    coordinates('com.qmdeve.blurview', 'core', VERSION)

    pom {
        name = 'QmBlurView Components For Android'
        description = DESCRIPTION
        url = WEBSITE
        inceptionYear = '2025'

        organization {
            name = 'QmDeve'
            url = 'https://www.qmdeve.com'
        }

        licenses {
            license {
                name = 'MIT License'
                url = 'https://github.com/QmDeve/QmBlurView/blob/master/LICENSE'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'qmdeve'
                name = 'Donny Yang'
                email = 'donny@qmdeve.com'
                organization = 'QmDeve'
                organizationUrl = 'https://qmdeve.com'
            }

            developer {
                id = 'sbaiahmed1'
                name = 'Ahmed Sbai'
                email = 'ahmedclubust@gmail.com'
                organizationUrl = 'https://github.com/sbaiahmed1'
            }

            developer {
                id = 'DanielAraldi'
                name = 'Daniel Sansão Araldi'
                email = 'danielsaraldi@gmail.com'
                organizationUrl = 'https://github.com/DanielAraldi'
            }
        }

        scm {
            connection = 'scm:git:github.com/QmDeve/QmBlurView.git'
            developerConnection = 'scm:git:ssh://github.com/QmDeve/QmBlurView.git'
            url = 'https://github.com/QmDeve/QmBlurView'
            tag = "v${VERSION}"
        }
    }

    publishToMavenCentral()
    signAllPublications()
}