name: Build Preview Version

on:
  workflow_dispatch:

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gen_version.outputs.version }}
      version_tag: ${{ steps.gen_version.outputs.version_tag }}
      version_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Validate gradle.properties exists
        run: |
          if [ ! -f "gradle.properties" ]; then
            echo "gradle.properties file not found!"
            exit 1
          fi

      - name: Read base version from gradle.properties
        id: read_props
        run: |
          if grep -q "^VERSION=" gradle.properties; then
            VERSION=$(grep "^VERSION=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
            if [ -z "$VERSION" ]; then
              echo "Version is empty in gradle.properties"
              exit 1
            fi
            BASE_VERSION=$(echo "$VERSION" | sed -E 's/[.-](alpha|beta|rc)[0-9]*$//; s/\.[0-9]{8}\.[0-9]+$//')
            echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
            echo "Base version: $BASE_VERSION"
          else
            echo "VERSION property not found in gradle.properties"
            exit 1
          fi

      - name: Generate version with today's build count
        id: gen_version
        run: |
          BASE_VERSION="${{ steps.read_props.outputs.base_version }}"
          TODAY=$(date -u +'%Y%m%d')

          EXISTING_COUNT=$(git tag -l "v*.${TODAY}.*" | wc -l | tr -d ' ')
          BUILD_NUMBER=$((EXISTING_COUNT + 1))

          VERSION="${BASE_VERSION}.${TODAY}.${BUILD_NUMBER}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION (today's build #$BUILD_NUMBER)"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG_NAME="${{ steps.gen_version.outputs.version_tag }}"
          if git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists!"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG_NAME does not exist, proceeding..."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build-preview:
    runs-on: ubuntu-latest
    needs: check-tag
    if: needs.check-tag.outputs.version_exists == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;30.0.15729638'
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build preview artifacts
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PVERSION=${{ needs.check-tag.outputs.version }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-artifacts
          path: |
            **/build/outputs/**/*.aar
            **/build/outputs/**/*.jar
            **/build/libs/*.jar
          if-no-files-found: warn

      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="${{ needs.check-tag.outputs.version_tag }}"
          git tag $TAG_NAME
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git $TAG_NAME

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-tag.outputs.version_tag }}
          name: ${{ needs.check-tag.outputs.version_tag }}
          body: |
            ## Preview Release

            - ⚠️ This is a **Preview** build.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}