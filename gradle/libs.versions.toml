[versions]
agp = "9.4.1"
annotationJvm = "1.11.0"
appcompat = "1.8.0"
constraintlayout = "2.2.2"
core = "1.19.1"
tracing = "2.0.3"
viewpager = "1.1.0"
vanniktech = "0.36.0"
junit = "1.3.0"
espressoCore = "3.7.0"
uiautomator = "2.4.0"
benchmarkMacroJunit4 = "1.5.0"

[libraries]
annotation-jvm = { module = "androidx.annotation:annotation-jvm", version.ref = "annotationJvm" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
core = { module = "androidx.core:core", version.ref = "core" }
tracing = { module = "androidx.tracing:tracing", version.ref = "tracing" }
viewpager = { module = "androidx.viewpager:viewpager", version.ref = "viewpager" }
viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager" }
junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacroJunit4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
signing = { id = "signing" }
android-test = { id = "com.android.test", version.ref = "agp" }