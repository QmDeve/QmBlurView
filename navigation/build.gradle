plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.vanniktech.maven.publish)
    alias(libs.plugins.signing)
}

android {
    namespace 'com.qmdeve.blurview.navigation'
    compileSdk 37

    defaultConfig {
        minSdk 23
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':core')
    implementation libs.viewpager
    implementation libs.viewpager2
}

if (hasProperty('jitpack')) {
    return
}
mavenPublishing {
    coordinates('com.qmdeve.blurview', 'navigation', VERSION)

    pom {
        name = 'QmBlurView Component Navigation Extended'
        description = DESCRIPTION
        url = WEBSITE
        inceptionYear = '2025'

        organization {
            name = 'QmDeve'
            url = 'https://www.qmdeve.com'
        }

        licenses {
            license {
                name = 'MIT License'
                url = 'https://github.com/QmDeve/QmBlurView/blob/master/LICENSE'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'qmdeve'
                name = 'Donny Yale'
                email = 'donny@qmdeve.com'
                organization = 'QmDeve'
                organizationUrl = 'https://qmdeve.com'
            }

            developer {
                id = 'sbaiahmed1'
                name = 'Ahmed Sbai'
                email = 'ahmedclubust@gmail.com'
                organizationUrl = 'https://github.com/sbaiahmed1'
            }

            developer {
                id = 'DanielAraldi'
                name = 'Daniel Sansão Araldi'
                email = 'danielsaraldi@gmail.com'
                organizationUrl = 'https://github.com/DanielAraldi'
            }
        }

        scm {
            connection = 'scm:git:github.com/QmDeve/QmBlurView.git'
            developerConnection = 'scm:git:ssh://github.com/QmDeve/QmBlurView.git'
            url = 'https://github.com/QmDeve/QmBlurView'
            tag = "v${VERSION}"
        }
    }

    publishToMavenCentral()
    signAllPublications()
}